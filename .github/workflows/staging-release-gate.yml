name: Staging Release Gate

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: "Deployment URL to smoke test"
        required: true
        default: "https://lexportai.com"
        type: string
      run_authenticated_smoke:
        description: "Run authenticated staging smoke tests"
        required: true
        default: false
        type: boolean

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck web app
        run: bun run --cwd apps/web typecheck

      - name: Lint web app
        run: bun run --cwd apps/web lint

      - name: Test web app
        run: bun run --cwd apps/web test

      - name: Build web app
        run: bun run --cwd apps/web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder
          SUPABASE_SECRET_KEY: build-placeholder
          OPENAI_API_KEY: sk-build-placeholder
          NEXT_PUBLIC_APP_URL: https://lexportai.com

  public-smoke:
    runs-on: ubuntu-latest
    needs: validate
    env:
      PLAYWRIGHT_BASE_URL: ${{ inputs.deployment_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: cd apps/web && bunx playwright install --with-deps chromium

      - name: Run public launch smoke suite
        run: cd apps/web && bunx playwright test e2e/public-launch.spec.ts

  smoke:
    if: ${{ inputs.run_authenticated_smoke }}
    runs-on: ubuntu-latest
    needs: public-smoke
    env:
      PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
      E2E_LOGIN_EMAIL: ${{ secrets.E2E_LOGIN_EMAIL }}
      E2E_LOGIN_PASSWORD: ${{ secrets.E2E_LOGIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify smoke-test secrets
        run: |
          test -n "$PLAYWRIGHT_BASE_URL"
          test -n "$E2E_LOGIN_EMAIL"
          test -n "$E2E_LOGIN_PASSWORD"

      - name: Install Playwright browser
        run: cd apps/web && bunx playwright install --with-deps chromium

      - name: Run staging smoke suite
        run: cd apps/web && bunx playwright test e2e/staging-smoke.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
